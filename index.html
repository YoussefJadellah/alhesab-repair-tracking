<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f7fb">
<title>تتبع صيانة جهازك</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#14243d;font:15px Tajawal,Tahoma,sans-serif}.frame{max-width:430px;min-height:100vh;margin:auto;padding:0;border:1px solid #dce4ef;border-radius:20px;background:#f7f9fc;overflow:hidden}.card{min-height:calc(100vh - 2px);padding:20px 16px 18px;background:#f7f9fc;border-radius:20px}.heading{text-align:center;color:#56708f;font-size:13px;margin:2px 0 4px}.success{text-align:center;margin:10px 0 16px}.checkmark{width:48px;height:48px;display:grid;place-items:center;margin:0 auto 6px;border-radius:50%;background:#12c875;color:white;font-size:28px;font-weight:800}.title{font-size:13px;color:#56708f}.invoice{font-weight:800;font-size:20px;color:#14243d;direction:ltr;unicode-bidi:embed;margin:4px 0}.date{color:#6f8098;font-size:12px}.total{font-weight:800;color:#1760bf;margin-top:7px;font-size:17px}.device{display:flex;align-items:center;gap:12px;padding:14px 15px;background:#fff;border:1px solid #e5ebf2;border-radius:16px;box-shadow:0 2px 4px #16243a0a}.phone{width:40px;height:40px;display:grid;place-items:center;background:#eef4ff;color:#315eea;font-size:21px;border-radius:12px;flex:none}.device-name{font-weight:750}.issue{margin-top:4px;color:#75849b;font-size:13px;line-height:1.5}.status{margin:14px 0 12px;display:grid;gap:3px}.step{display:grid;grid-template-columns:25px 1fr auto;align-items:center;min-height:34px;color:#8795a8;font-size:13px}.dot{width:18px;height:18px;border-radius:50%;background:#e5eaf1;border:1px solid #bdc8d8;display:grid;place-items:center;font-size:11px}.step.done{color:#078846}.step.done .dot{background:#18c46a;border-color:#18c46a;color:white}.step.current{color:#2863e8;font-weight:700}.step.current .dot{background:#3477ff;border-color:#3477ff;color:white}.step small{font-size:11px;color:#2863e8}.eta{padding:11px 14px;background:#edf1f7;border-radius:14px;text-align:center;color:#526783;font-size:12px}.updated{text-align:center;color:#8693a6;font-size:11px;margin-top:12px}.message{padding:16px;background:#fff;border:1px solid #e3e9f1;border-radius:12px;text-align:center;color:#526783}.hide{display:none}@media(min-width:480px){.frame{margin:28px auto;min-height:0}.card{min-height:680px}}
</style>
</head>
<body><main class="frame"><section class="card"><div class="heading" id="heading">تتبع جهازك</div><div id="message" class="message" style="margin-top:12px">جارٍ تحميل بيانات المتابعة…</div><div id="content" class="hide"><div class="success"><div class="checkmark">✓</div><div class="title" id="title">تم إصدار فاتورة الصيانة</div><div class="invoice" id="invoice">—</div><div class="date" id="invoice-date">—</div><div class="total" id="total">—</div></div><div class="device"><div class="phone" aria-hidden="true">▣</div><div><div class="device-name" id="device">—</div><div class="issue" id="issue">—</div></div></div><div class="status" id="steps"></div><div class="eta">موعد التسليم المتوقع: <b id="expected">سيتم تحديده</b></div><div class="updated">آخر تحديث: <span id="updated">—</span></div></div></section></main>
<script>
(() => {
 const params=new URLSearchParams(location.search);const orderMode=params.get('type')==='order';
 const API=`https://aazvvsjfpmjspzsekrnj.supabase.co/functions/v1/${orderMode?'order-tracker':'repair-tracker'}`;
 const repairStates=[['received','تم استلام الجهاز'],['diagnosing','قيد الفحص'],['repairing','قيد الإصلاح'],['ready','جاهز للاستلام'],['delivered','تم التسليم']];
 const orderStates=[['received','تم استلام الطلب'],['preparing','تجهيز الطلب'],['shipped','خرج الطلب للتوصيل'],['delivered','تم تسليم الطلب']];
 const token=params.get('token')||'';const $=id=>document.getElementById(id);
 if(orderMode){document.title='متابعة طلبك';$('heading').textContent='متابعة طلبك';$('title').textContent='جاري تحميل حالة الطلب';$('.eta').classList.add('hide');}
 function showMessage(text,error=false){$('message').textContent=text;$('message').style.color=error?'#b42318':'';}
 function formatDate(value){if(!value)return'—';const d=new Date(String(value).replace(' ','T'));return Number.isNaN(d.getTime())?value:d.toLocaleString('ar-EG');}
 function formatMoney(value){const n=Number(value);return Number.isFinite(n)?`${new Intl.NumberFormat('ar-EG',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n)} ج.م`:'—';}
 async function refresh(){
  if(!/^[a-f0-9]{48}$/.test(token)){showMessage('افتح رابط التتبع الخاص بفاتورتك. الرابط الأساسي وحده لا يحتوي رقم الفاتورة.',true);return;}
  try{
   const res=await fetch(`${API}?token=${encodeURIComponent(token)}`,{cache:'no-store'});const d=await res.json().catch(()=>({}));if(!res.ok)throw new Error(d.error||'لم يتم العثور على طلب المتابعة');
   $('invoice').textContent=d.invoice_no||(orderMode?'طلب':'فاتورة صيانة');$('invoice-date').textContent=formatDate(d.invoice_created_at);$('total').textContent=`الإجمالي: ${formatMoney(d.invoice_total)}`;
   let states=repairStates;
   if(orderMode){$('device').textContent=d.customer_name||'طلب المطعم / الكافيه';$('issue').textContent=d.order_type==='delivery'?'نوع الاستلام: توصيل':'نوع الاستلام: استلام من المحل';states=d.order_type==='delivery'?orderStates:orderStates.filter(x=>x[0]!=='shipped');$('title').textContent=`حالة الطلب: ${(orderStates.find(x=>x[0]===d.status)||[])[1]||'قيد المتابعة'}`;}
   else{$('device').textContent=d.device||'نوع الجهاز غير محدد';$('issue').textContent=d.issue?`العطل: ${d.issue}`:'العطل غير مسجل';$('expected').textContent=d.expected_at||'سيتم تحديده';}
   $('updated').textContent=formatDate(d.updated_at);
   const active=states.findIndex(x=>x[0]===d.status);$('steps').replaceChildren(...states.map(([key,label],i)=>{const done=i<active||d.status==='delivered';const current=i===active&&d.status!=='delivered';const row=document.createElement('div');row.className='step '+(done?'done':current?'current':'future');const dot=document.createElement('span');dot.className='dot';dot.textContent=done?'✓':current?'•':'';const text=document.createElement('span');text.textContent=label;const meta=document.createElement('small');meta.textContent=current?'المرحلة الحالية':'';row.append(dot,text,meta);return row;}));
   $('message').classList.add('hide');$('content').classList.remove('hide');
  }catch(e){$('content').classList.add('hide');$('message').classList.remove('hide');showMessage(e.message||'تعذر تحميل الحالة حالياً',true);}
 }
 refresh();setInterval(refresh,15000);
})();
</script></body></html>
